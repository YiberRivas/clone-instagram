<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clon de Instagram</title>
    <link rel="stylesheet" href="/css/History.css">
    <link rel="icon" href="../img/favico1.jpeg">
</head>
<body>
    <div class="instagram-post">
        <div class="post-header">
          
            <div class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1024px-Instagram_logo.svg.png" alt="Logo Instagram">
            </div>

            
            <div class="profile">
                <img src="/img/historias/historia11.jpg" alt="Perfil" class="profile-pic">
                <span class="username">Yiber R</span>
            </div>

           
            <a href="/html/index.html" class="close-button">✖</a>
        </div>

        <div class="post-image">
            <img src="/img/historias/istoria5.jpg" alt="Publicación" class="main-image">
        </div>

        <div class="post-actions">
            <button class="like-button">❤️</button>
            <button class="comment-button">💬</button>
            <button class="share-button">↗️</button>
            <button class="save-button">🔖</button>
        </div>

        <div class="post-comments">
            <p><strong>Yiber R:</strong> 🥰 </p>
            <p><strong>El_pepe:</strong> Me encanta.</p>
        </div>
    </div>
</body>
</html>
